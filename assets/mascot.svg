  <path d="M134 96 L166 88" stroke="#C8742A" stroke-width="6" stroke-linecap="round"/>

  <!-- 鼻子 -->
  <path d="M113 124 Q120 119 127 124 Q120 132 113 124 Z" fill="#E8879B"/>

  <!-- 张着嘴哈气 -->
  <path d="M103 138 Q120 129 137 138 Q135 159 120 162 Q105 159 103 138 Z" fill="#5A3A2E"/>
  <ellipse cx="120" cy="156" rx="9" ry="5" fill="#E8879B"/>
  <path d="M107 139 L114 139 L110.5 147 Z" fill="#FFFFFF"/>
  <path d="M126 139 L133 139 L129.5 147 Z" fill="#FFFFFF"/>

  <!-- 胡须 -->
  <g stroke="#D8C7B2" stroke-width="2.5" stroke-linecap="round">
    <path d="M72 138 L44 130"/>
    <path d="M72 145 L42 145"/>
    <path d="M72 152 L46 160"/>
    <path d="M168 138 L196 130"/>
    <path d="M168 145 L198 145"/>
