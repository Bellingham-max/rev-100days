<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 230" width="260" height="230" role="img" aria-label="">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8BC69"/>
      <stop offset="1" stop-color="#EC9A3C"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2A94F"/>
      <stop offset="1" stop-color="#DE8730"/>
    </linearGradient>
  </defs>

  <!-- 身体 -->
  <ellipse cx="120" cy="218" rx="66" ry="40" fill="url(#body)"/>
  <ellipse cx="120" cy="222" rx="36" ry="26" fill="#FFF6E8"/>

  <!-- 飞机耳：向外压平 -->
  <path d="M74 88 L6 54 Q-4 49 4 64 L42 106 Z" fill="url(#fur)"/>
  <path d="M186 88 L254 54 Q264 49 256 64 L218 106 Z" fill="url(#fur)"/>
