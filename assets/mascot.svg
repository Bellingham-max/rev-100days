  <!-- 哈出的气 -->
  <g stroke="#B0BEC5" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M204 148 q10 3 12 11"/>
    <path d="M212 136 q14 5 17 15"/>
    <path d="M212 162 q8 4 9 10"/>
